name: Deploy and Test Kind Cluster

on:
  workflow_dispatch:
  push:
    branches: [feature/petclinic-improvements]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/deploy-and-test-cluster.yml'
  pull_request:
    branches: [feature/petclinic-improvements]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/deploy-and-test-cluster.yml'

permissions:
  contents: read

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify and package the application
        run: ./mvnw -B verify

      - name: Build the application image
        run: docker build --tag petclinic:ci .

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: petclinic

      - name: Load the application image into Kind
        run: kind load docker-image petclinic:ci --name petclinic

      - name: Deploy PostgreSQL and wait for it
        run: |
          kubectl apply -f k8s/db.yml
          kubectl rollout status deployment/demo-db --timeout=180s

      - name: Create CI credentials and deploy the application
        env:
          PETCLINIC_ADMIN_USERNAME: admin
          PETCLINIC_ADMIN_PASSWORD: ci-admin-password
          PETCLINIC_USER_USERNAME: pet-user
          PETCLINIC_USER_PASSWORD: ci-user-password
        run: |
          kubectl create secret generic petclinic-auth --from-literal=admin-username="$PETCLINIC_ADMIN_USERNAME" --from-literal=admin-password="$PETCLINIC_ADMIN_PASSWORD" --from-literal=user-username="$PETCLINIC_USER_USERNAME" --from-literal=user-password="$PETCLINIC_USER_PASSWORD"
          kubectl apply -f k8s/petclinic.yml

      - name: Wait for the application deployment
        run: |
          if ! kubectl rollout status deployment/petclinic --timeout=180s; then
            kubectl get pods -l app=petclinic -o wide
            kubectl describe pods -l app=petclinic
            kubectl logs deployment/petclinic --all-containers=true --tail=200 || true
            exit 1
          fi

      - name: Check health endpoints and authentication
        env:
          PETCLINIC_ADMIN_USERNAME: admin
          PETCLINIC_ADMIN_PASSWORD: ci-admin-password
          PETCLINIC_USER_USERNAME: pet-user
          PETCLINIC_USER_PASSWORD: ci-user-password
        run: |
          kubectl port-forward service/petclinic 8080:80 >/tmp/petclinic-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/readyz >/dev/null; then
              break
            fi
            sleep 2
          done

          ready_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/readyz)
          live_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/livez)
          health_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/actuator/health)
          anonymous_code=$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Accept: text/html' http://127.0.0.1:8080/)
          admin_auth_code=$(curl --silent --output /dev/null --write-out '%{http_code}' --user "$PETCLINIC_ADMIN_USERNAME:$PETCLINIC_ADMIN_PASSWORD" http://127.0.0.1:8080/)
          user_auth_code=$(curl --silent --output /dev/null --write-out '%{http_code}' --user "$PETCLINIC_USER_USERNAME:$PETCLINIC_USER_PASSWORD" http://127.0.0.1:8080/)
          invalid_auth_code=$(curl --silent --output /dev/null --write-out '%{http_code}' --user "$PETCLINIC_USER_USERNAME:wrong-password" http://127.0.0.1:8080/)
          admin_env_code=$(curl --silent --output /dev/null --write-out '%{http_code}' --user "$PETCLINIC_ADMIN_USERNAME:$PETCLINIC_ADMIN_PASSWORD" http://127.0.0.1:8080/actuator/env)
          user_env_code=$(curl --silent --output /dev/null --write-out '%{http_code}' --user "$PETCLINIC_USER_USERNAME:$PETCLINIC_USER_PASSWORD" http://127.0.0.1:8080/actuator/env)

          test "$ready_code" = "200"
          test "$live_code" = "200"
          test "$health_code" = "200"
          test "$anonymous_code" = "302"
          test "$admin_auth_code" = "200"
          test "$user_auth_code" = "200"
          test "$invalid_auth_code" = "401"
          test "$admin_env_code" = "200"
          test "$user_env_code" = "403"
